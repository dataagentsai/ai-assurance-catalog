# The realization axes: how an obligation is physically discharged.
#
# These are kept orthogonal on purpose. The same obligation — "output must not
# leak PII" — is a deterministic detector in CI, a blocking gateway filter at
# runtime, and a sampled model-graded check in production. One statement, three
# realizations, different machinery. A catalog that fused them would force a
# vendor choice before the architect had finished thinking.
#
# Tool classes name a CLASS, never a product. See docs/NON-GOALS.md.

version: "0.1.0"

mechanisms:
  - id: M1
    name: Deterministic assertion
    summary: >-
      Exact match, regex, JSON-schema validation, parser or compiler exit code.
      Cheap, fast, zero ambiguity. Cannot judge quality — only conformance.
  - id: M2
    name: Programmatic metric
    summary: >-
      Field-level F1, recall@k, p95 latency, cost per successful task. Needs
      labelled data or instrumentation; yields a number you can trend and
      threshold.
  - id: M3
    name: Model-graded, reference-free
    summary: >-
      A model scores the output against a written rubric. The only practical
      mechanism for open-ended quality, and it must itself be validated —
      every A10 obligation applies to your judge.
  - id: M4
    name: Model-graded, reference-based
    summary: >-
      Compare against a gold answer, or pairwise against the previous release.
      More stable than M3 because the judge has an anchor. Requires curated
      references.
  - id: M5
    name: Trace assertion
    summary: >-
      Assert over emitted spans: structure, ordering, attribute presence, step
      count, token totals. The only way to test HOW a system reached an answer
      rather than what it said.
  - id: M6
    name: Human review
    summary: >-
      Annotation queue or SME sign-off. Ground truth for everything else; the
      labels it produces are what validate M3 and M4. Does not scale, so spend
      it on calibration.
  - id: M7
    name: Adversarial suite
    summary: >-
      Generated attacks, input mutation, fault injection, fuzzing. Coverage
      grows over time; every production incident should become a new case here.

# WHEN it runs. Each stage also carries the ISO/IEC/IEEE 12207 technical
# process it belongs to, which is how an obligation's `phase` is derived rather
# than tagged (Spec Charter, §3). The split falls where the request path does: a
# check that runs before release is verification; a check that runs against live
# traffic is operation. S4 is the interesting case and sits on the verification
# side — it runs in production but it is a gate the release had to pass, and
# what it asserts was decided before deployment.
stages:
  - id: S1
    name: Dev loop
    process: verification
    summary: Run by hand while iterating. Seconds. Nobody but the author sees a failure.
  - id: S2
    name: CI, pre-merge
    process: verification
    summary: >-
      Every change to prompt, schema, tool definition or model pin. Minutes,
      cheap and deterministic — mock the model where the test is about plumbing.
  - id: S3
    name: Pre-release eval
    process: verification
    summary: >-
      Full offline dataset against the release candidate. Real model calls, real
      cost. This is where release gates live.
  - id: S4
    name: Runtime gateway
    process: verification
    summary: >-
      Inline on the live request path, blocking. A failure is seen by the end
      user as a refusal, redaction or fallback.
  - id: S5
    name: Production online eval
    process: operation
    summary: >-
      Asynchronous scoring of sampled live traces. Raises an alert, never
      blocks. The only stage that sees your real input distribution.
  - id: S6
    name: Scheduled regression
    process: operation
    summary: >-
      Periodic re-run of frozen cases to catch provider-side model drift and
      corpus staleness. Nothing changed on your side — that is the point.

# WHO provides the machinery. Orthogonal to mechanism (what computes the
# verdict) and stage (when it runs) — the same mechanism is available from
# several of these, at very different cost and with very different lock-in.
approaches:
  - id: in-house
    name: Write it yourself
    summary: >-
      A test, a wrapper, a script in your own repository. Most control, most
      portable, most work. Usually the strongest evidence, because it asserts
      exactly what you meant rather than what a product happens to measure.
  - id: open-source
    name: Open-source library
    summary: >-
      A library you run yourself. No vendor dependency and no data leaves your
      environment; you own the upgrade treadmill and the scaling.
  - id: platform
    name: Hosted eval or observability platform
    summary: >-
      Datasets, experiments, scorers and traces as a service. Fastest to useful,
      and the place where a growing share of your evidence ends up living — so
      the export path matters more than it looks on day one.
  - id: gateway
    name: AI gateway or proxy
    summary: >-
      Enforcement on the request path: routing, quota, redaction, guardrail
      hooks, budget ceilings. The only approach that can PREVENT rather than
      detect, and the only one that covers calls your application code forgot
      to route through the wrapper.
  - id: cloud-native
    name: Cloud provider managed service
    summary: >-
      Content safety, PII detection, model registries, IAM restrictions from the
      cloud you already run in. Low integration cost and procurement is usually
      already done; opaque internals and hard to reproduce in CI.
  - id: human
    name: Human process
    summary: >-
      Annotation queues, review samples, sign-off. Does not scale, and is the
      ground truth every model-graded mechanism is calibrated against.

# Dimensions are the quality attribute under test. Used for filtering and for
# the coverage matrix; not part of the identity of a case. Each one is a facet
# under a `concern` — the family-wide axis — through the crosswalk in
# taxonomy/concerns.yaml, which the linter requires to be total.
dimensions:
  - correctness
  - grounding
  - format
  - instruction
  - robustness
  - state
  - tool-use
  - trajectory
  - security
  - safety
  - privacy
  - reliability
  - determinism
  - cost
  - latency
  - observability
  - drift
  - oversight

levels:
  - id: MUST
    summary: >-
      Inherent to the shape. A system without it cannot claim conformance.
      Skipping requires a recorded accepted risk with a named owner.
  - id: SHOULD
    summary: >-
      Expected in production systems. Valid reasons to omit exist and must be
      stated in the risk register.
  - id: MAY
    summary: >-
      Applies when the stated condition holds — regulated domain, high blast
      radius, external users.
