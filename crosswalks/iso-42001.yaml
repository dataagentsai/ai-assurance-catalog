# Crosswalk: ISO/IEC 42001:2023 Annex A (reference control objectives and
# controls) -> AAC obligations.
#
# INFORMATIVE. Released out of band from the catalog: an ISO revision must never
# force a version bump in catalog/.
#
# COPYRIGHT. ISO/IEC 42001 is copyrighted and sold by ISO. This file cites
# control identifiers and a short descriptive label for each, and nothing else.
# No control text, guidance text (Annex B) or objective wording is reproduced or
# paraphrased here. The labels are this project's shorthand for finding the
# control — check them against your licensed copy, not the other way round.
#
# A management-system control governs a PROCESS. A test obligation is at best
# evidence that the process operated, so every mapping below is `evidence-for`
# or `partial`, and none is `tests-for`. Claiming a case is equivalent to a
# control is the fastest way to have a crosswalk dismissed by the first auditor
# who reads it.
#
# All 38 Annex A controls (A.2.2 to A.10.4) appear exactly once: under
# `mappings`, or under `unmapped` with the reason. The clause numbers of the
# management-system body (4 to 10) are out of scope for this file.

framework: iso-iec-42001
framework_version: "2023 (first edition), Annex A"
framework_url: https://www.iso.org/standard/81230.html
license_note: >-
  Copyrighted and paywalled. Control identifiers may be cited; control text may
  not be reproduced. Labels below are descriptive shorthand, not ISO titles
  quoted for their content.
version: "0.1.0"

mappings:
  - external: A.6.2.4
    external_name: AI system verification and validation
    relation: evidence-for
    cases: [AAC-0001, AAC-0002, AAC-0003, AAC-0013, AAC-0098, AAC-0099]
    note: >-
      Nearly every covered row of an adopter's coverage report is evidence for
      this control; listed are the core obligations that frame verification
      against the declared contract (AAC-0002, AAC-0003, AAC-0099) and
      validation against intended use (AAC-0001, AAC-0013, AAC-0098). A dated
      series of reports from CI is the evidence form a surveillance audit
      prefers — see docs/REPORT.md.

  - external: A.6.2.5
    external_name: AI system deployment
    relation: evidence-for
    cases: [AAC-0107, AAC-0012, AAC-0101, AAC-0102, AAC-0034]
    note: >-
      Release-path evidence: what serves is what was evaluated (AAC-0107),
      rollback is exercised (AAC-0012), and the changes that conventionally
      bypass evaluation — routing configuration, cost, index rebuilds — are
      gated like a model change.

  - external: A.6.2.6
    external_name: AI system operation and monitoring
    relation: evidence-for
    cases: [AAC-0014, AAC-0114, AAC-0116, AAC-0016, AAC-0082, AAC-0079, AAC-0115]

  - external: A.6.2.8
    external_name: AI system recording of event logs
    relation: evidence-for
    cases: [AAC-0011, AAC-0060, AAC-0080, AAC-0100, AAC-0095]
    note: >-
      AAC-0095 belongs here as the counterweight: logs are redacted at write
      time and retention is bounded, and the two obligations hold together
      rather than trading off.

  - external: A.7.5
    external_name: Data provenance
    relation: partial
    cases: [AAC-0108]
    note: >-
      Retrieval-corpus provenance only. Provenance of training and fine-tuning
      data is model-level and out of scope per docs/NON-GOALS.md. Mapped on the
      reading that Annex A's data controls reach data the system uses in
      operation, not only data it was trained on; confirm against your copy.

  - external: A.10.3
    external_name: Suppliers
    relation: evidence-for
    cases: [AAC-0094, AAC-0107, AAC-0016, AAC-0098]
    note: >-
      The model provider is the supplier that matters most to an LLM
      application. These show the supplier's product is restricted to an
      approved set, pinned, watched for silent change, and evaluated on every
      route. The supplier-management process is the organisation's.

unmapped:
  - external: A.2.2
    external_name: AI policy
    reason: Organisational policy.
  - external: A.2.3
    external_name: Alignment with other organisational policies
    reason: Organisational policy.
  - external: A.2.4
    external_name: Review of the AI policy
    reason: Organisational policy.
  - external: A.3.2
    external_name: AI roles and responsibilities
    reason: Organisational roles.
  - external: A.3.3
    external_name: Reporting of concerns
    reason: Organisational process for people to raise concerns.
  - external: A.4.2
    external_name: Resource documentation
    reason: Documentation.
  - external: A.4.3
    external_name: Data resources
    reason: Documentation of resources.
  - external: A.4.4
    external_name: Tooling resources
    reason: Documentation of resources.
  - external: A.4.5
    external_name: System and computing resources
    reason: Documentation of resources.
  - external: A.4.6
    external_name: Human resources
    reason: People and competence.
  - external: A.5.2
    external_name: Impact assessment process
    reason: Impact assessment is an organisational process.
  - external: A.5.3
    external_name: Documentation of impact assessments
    reason: Documentation.
  - external: A.5.4
    external_name: Impacts on individuals or groups
    reason: Impact assessment; fairness measurement is out of scope per docs/NON-GOALS.md.
  - external: A.5.5
    external_name: Societal impacts
    reason: Impact assessment.
  - external: A.6.1.2
    external_name: Objectives for responsible development
    reason: Organisational objectives.
  - external: A.6.1.3
    external_name: Processes for responsible design and development
    reason: Process definition; its operation is evidenced under A.6.2.4 and A.6.2.5.
  - external: A.6.2.2
    external_name: Requirements and specification
    reason: >-
      Specification is the adopter's. The catalog's obligations are not a
      system's requirements and are not claimed as its specification.
  - external: A.6.2.3
    external_name: Documentation of design and development
    reason: Documentation.
  - external: A.6.2.7
    external_name: Technical documentation
    reason: Documentation.
  - external: A.7.2
    external_name: Data for development and enhancement
    reason: Training and development data are model-level and out of scope per docs/NON-GOALS.md.
  - external: A.7.3
    external_name: Acquisition of data
    reason: Acquisition process; ingestion controls on a retrieval corpus are under A.7.5.
  - external: A.7.4
    external_name: Quality of data
    reason: >-
      Data-quality requirements are set by the organisation. A.7.5 carries the
      nearest evidence; mapping AAC-0108 here as well would claim more than a
      provenance check shows.
  - external: A.7.6
    external_name: Data preparation
    reason: Training-data preparation is out of scope per docs/NON-GOALS.md.
  - external: A.8.2
    external_name: System documentation and information for users
    reason: Documentation.
  - external: A.8.3
    external_name: External reporting
    reason: Organisational reporting process.
  - external: A.8.4
    external_name: Communication of incidents
    reason: Organisational communication process.
  - external: A.8.5
    external_name: Information for interested parties
    reason: Organisational communication.
  - external: A.9.2
    external_name: Processes for responsible use
    reason: Organisational process for the organisation's own use of AI.
  - external: A.9.3
    external_name: Objectives for responsible use
    reason: Organisational objectives.
  - external: A.9.4
    external_name: Intended use
    reason: >-
      Concerns how the organisation uses the system. Scope-of-refusal testing
      (AAC-0003) shows the system stays inside a declared scope, which is
      related but not the same claim.
  - external: A.10.2
    external_name: Allocation of responsibilities
    reason: Contractual and organisational.
  - external: A.10.4
    external_name: Customers
    reason: Customer relationship.
