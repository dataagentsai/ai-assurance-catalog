title: |-
  Irreversible actions require approval

statement: |-
  A defined class of actions pauses for human authorisation, with the approval path, the timeout behaviour and the case where the facts changed during the pause all tested. A pause puts a human interval between reading a row and acting on it, and every other control on that path — who decided, when, under which key — is satisfied by a grant that no longer fits what it was granted about.

