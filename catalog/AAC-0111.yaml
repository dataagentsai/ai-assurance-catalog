title: |-
  A request acts only as the identity its credential proves

statement: |-
  Who a request acts as is taken from a credential the caller cannot author, and never from anything the caller states — not a field in the request, not a name in the message, not a claim the model repeats. A credential that is absent, expired, altered or signed by anything but the issuer yields no identity at all rather than a lesser one. Tested by asking as one user for another user's resource, and by stating someone else's identifier in the body of an otherwise valid request.

