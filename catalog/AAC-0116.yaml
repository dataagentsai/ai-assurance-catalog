title: |-
  A synthetic run exercises the deployed system on a schedule

statement: |-
  A small set of frozen cases runs through the deployed system — its own entrypoint, identity, gateway and tools, not a copy of them — on a schedule, as a test identity whose effects are isolated from real users' data, and a failed case alerts a person. Monitoring built on real traffic reads a broken deployment as a quiet hour; this is the check that does not wait for a user to find it.

