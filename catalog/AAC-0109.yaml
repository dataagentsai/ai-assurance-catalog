core: false

title: |-
  Non-productive repetition is detected and broken

statement: |-
  A loop that issues the same call with the same arguments repeatedly is detected and terminated by the harness, with the termination reason recorded. Hard non-termination and path length are separate obligations and neither covers this: a loop that repeats three times and then stops within its step budget is inside every limit and has still made no progress. The call signature must be compared on normalised arguments, since a detector that treats two orderings of the same object as different calls never fires.

