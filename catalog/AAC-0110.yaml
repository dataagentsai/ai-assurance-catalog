status: active
since: "1.2.0"

level: MUST
dimension: grounding
gate: true

# Applies to these archetypes. CORE cases list every archetype explicitly
# rather than relying on an inheritance keyword, so a consumer never has to
# resolve the taxonomy to know whether a case applies.
archetypes:
  - A6
  - A7
  - A9
core: false

title: |-
  A claimed action is supported by that action's result

statement: |-
  Where the output states that an action was taken, the result of that action is present and successful in the same exchange. Test the three ways this fails: the tool was never called, the tool refused, and the tool errored. A refusal is not a success — an action the system declined did not happen, and a response that says otherwise is false in the way that reaches a person.

  This is distinct from faithfulness to retrieved content. That obligation asks whether a statement about the world is supported by what was read; this one asks whether a statement about the system's own behaviour is supported by what it did. An agent that never issues an unauthorised refund can still tell a customer it issued one, and only the second failure leaves no trace in any ledger.

  The check must run against the results of the current exchange rather than the state read at its start. Where the world changes between a read and a write, the output can be consistent with what the system expected and contradict what actually happened.

# Realization is advisory: it names the class of machinery that can discharge
# the obligation, never a product. See docs/REALIZATION.md.
mechanisms:
