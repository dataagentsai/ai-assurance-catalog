title: |-
  Behaviour rates are watched in production against a baseline

statement: |-
  The rates that say whether the system is doing its job — how requests end, refusals and escalations by the rule that decided them, tool and model failures by kind, runs stopped by a limit, cost per unit of work — are computed continuously from production and compared with a declared baseline, and a shift beyond a declared bound alerts a person before a user reports it. Every request can succeed while the system fails: a system that refuses everything answers each request correctly.

