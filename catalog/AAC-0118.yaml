core: false

title: |-
  Autonomy widens only on agreement measured for that decision

statement: |-
  Before a decision a person approves is left to the agent — a refund under a limit, a replacement under a value — reviewers' agreement with the agent is measured on that decision class alone, not on the conversations at large, and sampled by stratum: the inputs the decision turns on being ambiguous, and values near the proposed limit. Each stratum's sample size and agreement are stated beside the limit they justify, and a stratum where agreement is not shown stays with a person.

  An overall agreement rate says almost nothing about one decision inside it. Five hundred conversations sampled uniformly, of which the decision being automated is one in twenty-five, measure that decision on about twenty cases — and where the disagreements cluster on ambiguous input, the clustering is on exactly the cases the change would stop a person seeing.

