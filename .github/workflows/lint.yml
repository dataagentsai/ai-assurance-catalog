name: catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The page is a build artifact of catalog/, never a file anyone edits. It is
# committed as well as deployed, so the catalog stays readable straight from the
# repository without waiting on a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-fund --no-audit

      # Schema, identifier permanence, and the no-product-names discipline.
      - run: npm run lint

      # The example report is a build artifact of the adapters, not a document.
      # Rebuilding it from the fixtures proves the whole chain — fixture,
      # adapter, merge, schema — still works together.
      - name: example report rebuilds from fixtures
        run: |
          npm run build-example
          if ! git diff --quiet -- examples/coverage-report.example.json; then
            echo "::error::example report is stale. Run 'npm run build-example' and commit."
            git diff -- examples/coverage-report.example.json | head -60
            exit 1
          fi
      - run: npm run validate-report -- examples/coverage-report.example.json

      # The site is a build artifact. If a rebuild produces a diff, someone
      # edited generated output instead of the catalog it comes from.
      # The page is useless if its client script dies before rendering.
      - run: npm run check-page

      - name: site/ is in sync with catalog/
        run: |
          npm run render
          if ! git diff --quiet -- site/; then
            echo "::error::site/ is stale or was hand-edited. Run 'npm run build' and commit."
            git diff --stat -- site/
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  # Deployment is its own job so a repository without Pages turned on still
  # gets an honest green signal on the catalog itself. This job stays red until
  # Settings > Pages > Build and deployment is set to GitHub Actions — that is a
  # repository setting and cannot be enabled from a workflow.
  deploy:
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
